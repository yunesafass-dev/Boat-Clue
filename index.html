<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08191F" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>The Ship's Manifest</title>
<style>
  :root{
    --ink:#08191F; --hull:#0F313B; --deep:#143F4C;
    --brass:#C9A227; --brass-dim:#8A7220;
    --chart:#E6DCC3; --chart-dim:#B9AE93;
    --signal:#B0463C; --line:rgba(201,162,39,.22);
    --display: Didot,'Bodoni 72','Playfair Display',Georgia,serif;
    --body: ui-sans-serif,-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono: ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    background-image:radial-gradient(120% 80% at 50% 0%, var(--deep) 0%, var(--ink) 62%);
    background-attachment:fixed;
    color:var(--chart); font-family:var(--body);
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:520px;margin:0 auto;padding:28px 18px calc(60px + env(safe-area-inset-bottom))}
  h1{font-family:var(--display);font-size:46px;line-height:.98;margin:0;letter-spacing:-.01em}
  h1 em{color:var(--brass)}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass-dim);margin-bottom:6px}
  .lede{font-size:15px;line-height:1.6;color:var(--chart-dim);margin:14px 0 0}
  .note{font-size:13px;line-height:1.6;color:var(--chart-dim)}
  .card{background:rgba(15,49,59,.55);border:1px solid var(--line);padding:18px;border-radius:2px;margin-bottom:14px}
  .rule{height:1px;margin:22px 0;background:repeating-linear-gradient(90deg,rgba(201,162,39,.45) 0 6px,transparent 6px 12px)}
  input,select,textarea{
    width:100%;background:rgba(8,25,31,.65);border:1px solid rgba(201,162,39,.35);
    color:var(--chart);padding:12px 13px;font-family:var(--body);font-size:16px;border-radius:2px
  }
  textarea{resize:vertical;line-height:1.5}
  input.code{font-family:var(--mono);letter-spacing:.28em;text-transform:uppercase}
  label{display:block;margin-bottom:14px}
  button{font-family:var(--body);border-radius:2px;cursor:pointer;border:1px solid;font-weight:600}
  .btn{display:block;width:100%;padding:13px 18px;font-size:15px;letter-spacing:.02em;background:var(--brass);color:var(--ink);border-color:var(--brass);margin-bottom:9px}
  .btn.ghost{background:transparent;color:var(--chart);border-color:rgba(230,220,195,.35)}
  .btn.signal{background:var(--signal);color:#fff;border-color:var(--signal)}
  .btn:disabled{background:rgba(230,220,195,.12);color:rgba(230,220,195,.4);border-color:rgba(230,220,195,.15);cursor:default}
  .tabs{display:flex;gap:8px;margin-bottom:18px}
  .tabs button{flex:1;background:transparent;color:var(--chart-dim);border-color:rgba(201,162,39,.3);
    padding:9px 0;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
  .tabs button[aria-selected="true"]{background:var(--brass);color:var(--ink);border-color:var(--brass)}
  .seg{display:flex;gap:8px;margin-bottom:16px}
  .seg button{flex:1;background:transparent;color:var(--chart-dim);border-color:rgba(201,162,39,.25);
    padding:8px 0;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .seg button[aria-selected="true"]{background:rgba(201,162,39,.16);color:var(--brass);border-color:var(--brass)}
  .plate{border:2px solid var(--brass);background:rgba(201,162,39,.07);padding:22px 18px;text-align:center;border-radius:2px}
  .plate .code{font-family:var(--mono);font-size:52px;font-weight:700;letter-spacing:.22em;margin-left:.22em;color:var(--brass)}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(201,162,39,.14);font-size:16px}
  .row:last-child{border-bottom:none}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.15em;color:var(--brass-dim)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{border:1px solid var(--brass);color:var(--brass);padding:6px 10px;font-size:14px;border-radius:2px}
  .err{border:1px solid var(--signal);background:rgba(176,70,60,.14);color:#F0C9C4;padding:11px 13px;font-size:14px;border-radius:2px;margin:14px 0;line-height:1.5}
  .ok{border:1px solid var(--brass);background:rgba(201,162,39,.12);color:var(--brass);padding:11px 13px;font-size:14px;border-radius:2px;margin:14px 0;line-height:1.5}
  .big{font-family:var(--display);font-size:26px;line-height:1.2;margin:6px 0 0}
  .huge{font-family:var(--display);font-size:34px;line-height:1.2;margin:14px 0 18px;color:var(--brass)}
  .huge.miss{color:var(--signal)}
  .noteline{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;margin-bottom:4px;
    border:1px solid rgba(201,162,39,.16);background:rgba(15,49,59,.4);font-size:15px;border-radius:2px;cursor:pointer}
  .noteline[data-state="1"]{color:rgba(230,220,195,.32);text-decoration:line-through;cursor:default}
  .noteline[data-state="2"]{background:rgba(176,70,60,.18)}
  .noteline .tag[data-state="2"]{color:var(--signal)}
  .lock{text-align:center;padding:46px 18px;border:2px solid var(--brass);background:rgba(201,162,39,.06);border-radius:2px}
  .lock .who{font-family:var(--display);font-size:38px;line-height:1.1;margin:12px 0 6px}
  .footer{margin-top:30px;padding-top:16px;border-top:1px solid rgba(201,162,39,.16);
    display:flex;justify-content:space-between;align-items:center}
  .footer button{background:transparent;border:none;color:var(--chart-dim);font-family:var(--mono);
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:4px 0}
  @media (prefers-reduced-motion:no-preference){
    .card,.plate,.lock{animation:rise .28s ease-out both}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   THE SHIP'S MANIFEST — real-life Clue, dealt by the phone.
   Single file. Drop in a GitHub repo, turn on Pages, done.

   Paste your Firebase Realtime Database URL below. No trailing
   slash. Nothing else to configure — this talks to Firebase
   over plain REST, so there's no SDK and no app registration.
   ============================================================ */
const DB_URL = "https://boat-clue-default-rtdb.firebaseio.com/";

/* ---------------- defaults ---------------- */
const DEFAULTS = {
  suspects:["The Captain","The Deckhand","The Heiress","The Chef","The Stowaway","The Harbormaster","The Diver","The Widow"],
  weapons:["Anchor chain","Fillet knife","Mooring rope","Champagne bottle","Fire extinguisher","Boat hook","Winch handle","Ice pick"],
  rooms:["Bow","Stern","Galley","Head","Cabin","Flybridge","Engine room","Swim platform"]
};

/* ---------------- helpers ---------------- */
const LETTERS="ABCDEFGHJKLMNPQRSTUVWXYZ";
const newCode=()=>Array.from({length:4},()=>LETTERS[Math.floor(Math.random()*LETTERS.length)]).join("");
const newId=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
const byId=(g,id)=>g.players.find(p=>p.id===id);
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------------- state ---------------- */
const S={
  screen:"home", mode:null, code:null,
  me:null,        // online: {id,name}
  viewer:null,    // pass-and-play: whose eyes are on the phone
  game:null,
  tab:"play", turnMode:"ask", confirm:false, err:"", ok:"",
  nameIn:"", codeIn:"",
  pick:{}, notes:{}, busy:false, lastSync:""
};

/* ---------------- persistence ---------------- */
const LS="manifest.save";
function saveLocal(){
  try{
    if(S.mode==="local"&&S.game) localStorage.setItem(LS,JSON.stringify({game:S.game,notes:S.notes}));
    else if(S.mode==="online"&&S.game) localStorage.setItem(LS,JSON.stringify({online:true,code:S.code,me:S.me,notes:S.notes}));
  }catch(e){}
}
function clearLocal(){try{localStorage.removeItem(LS)}catch(e){}}

/* ---------------- network ---------------- */
const netOn=()=>!!DB_URL;
const url=c=>DB_URL.replace(/\/+$/,"")+"/games/"+encodeURIComponent(c)+".json";

async function netGet(c){
  const r=await fetch(url(c)+"?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error(r.status===401||r.status===403?"permission denied, check your database Rules":"HTTP "+r.status);
  const j=await r.json();
  if(j===null||j===undefined) return null;
  if(typeof j!=="string") throw new Error("that record isn't a game");
  return JSON.parse(j);
}
async function netPut(g){
  const r=await fetch(url(g.code),{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(JSON.stringify(g))
  });
  if(!r.ok) throw new Error(r.status===401||r.status===403?"permission denied, check your database Rules":"HTTP "+r.status);
}

/* apply a change to the game, wherever it lives */
async function mutate(fn,opts){
  opts=opts||{};
  if(S.mode==="local"){
    fn(S.game); S.lastSync=JSON.stringify(S.game);
    saveLocal(); if(!opts.quiet) render();
    return true;
  }
  if(S.busy) return false;
  S.busy=true;
  let good=false;
  try{
    const g=await netGet(S.code);
    if(!g) throw new Error("that game is no longer on the database");
    fn(g);
    await netPut(g);
    S.game=g; S.lastSync=JSON.stringify(g); S.err=""; good=true;
  }catch(e){
    S.err="Couldn't save that — "+e.message+".";
  }
  S.busy=false; saveLocal();
  if(!opts.quiet||!good) render();
  return good;
}

/* don't yank the screen out from under someone who's typing */
function typing(){
  const a=document.activeElement;
  return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
}

let poller=null;
function startPolling(){
  stopPolling();
  poller=setInterval(async()=>{
    if(S.busy||S.mode!=="online"||!S.code) return;
    try{
      const g=await netGet(S.code);
      if(!g) return;
      const sig=JSON.stringify(g);
      S.game=g;
      if(sig!==S.lastSync){ S.lastSync=sig; S.err=""; if(!typing()) render(); }
    }catch(e){}
  },2500);
}
function stopPolling(){ if(poller) clearInterval(poller); poller=null; }

/* ---------------- game logic ---------------- */
function makeGame(code,players){
  return{code:code,phase:"lobby",hostId:players.length?players[0].id:null,players:players,
    setup:clone(DEFAULTS),order:[],turn:0,pending:null,log:[],solution:null,winner:null};
}
function setupProblems(g){
  const all=[].concat(g.setup.suspects,g.setup.weapons,g.setup.rooms);
  const dup=all.find((c,i)=>all.indexOf(c)!==i);
  const out=[];
  if(g.players.length<2) out.push("Waiting on at least one more player before you can deal.");
  ["suspects","weapons","rooms"].forEach(k=>{ if(g.setup[k].length<3) out.push("Add at least three "+k+"."); });
  if(dup) out.push('Every name has to be different — "'+dup+'" appears twice.');
  if(all.length-3<g.players.length) out.push("Not enough cards to give everyone one. Add more.");
  return out;
}
function deal(g){
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const sol={suspect:pick(g.setup.suspects),weapon:pick(g.setup.weapons),room:pick(g.setup.rooms)};
  const deck=shuffle([].concat(g.setup.suspects,g.setup.weapons,g.setup.rooms)
    .filter(c=>c!==sol.suspect&&c!==sol.weapon&&c!==sol.room));
  g.order=shuffle(g.players.map(p=>p.id));
  g.players.forEach(p=>{p.hand=[];p.out=false;});
  deck.forEach((c,i)=>byId(g,g.order[i%g.order.length]).hand.push(c));
  g.solution=sol; g.phase="playing"; g.turn=0; g.pending=null; g.winner=null;
  g.log=[{t:"start",names:g.order.map(id=>byId(g,id).name)}];
}
function advance(g){
  for(let i=1;i<=g.order.length;i++){
    const idx=(g.turn+i)%g.order.length;
    if(!byId(g,g.order[idx]).out){ g.turn=idx; return; }
  }
  g.phase="over"; g.winner="nobody";
}
/* who the phone is waiting on right now */
function actorId(g){
  const p=g.pending;
  if(p) return (p.disproverId&&!p.card)?p.disproverId:p.by;
  return g.order[g.turn];
}
const myId=()=>S.mode==="local"?S.viewer:(S.me?S.me.id:null);
const notesFor=id=>(S.notes[id]=S.notes[id]||{});

/* keep the three dropdowns pointing at cards that still exist */
function syncPick(g){
  const map={s:"suspects",w:"weapons",r:"rooms"};
  for(const k in map){
    if(!g.setup[map[k]].includes(S.pick[k])){ S.pick[k]=g.setup[map[k]][0]; S.confirm=false; }
  }
}

/* ============================================================
   RENDER
   ============================================================ */
const app=document.getElementById("app");
function render(){ app.innerHTML=view(); }
const errBar=()=>S.err?'<div class="err">'+esc(S.err)+'</div>':"";
const okBar=()=>S.ok?'<div class="ok">'+esc(S.ok)+'</div>':"";

function view(){
  if(S.screen==="home") return home();
  if(!S.game) return '<p class="note">Reaching the database…</p>'+
    '<button class="btn ghost" data-a="reset">Back to the start</button>';
  if(S.game.phase==="lobby") return lobby();
  return game();
}

/* ---------- home ---------- */
function home(){
  return `
  <div style="margin-bottom:30px">
    <div class="eyebrow" style="margin-bottom:12px">Passenger list · sealed envelope</div>
    <h1>The Ship's<br><em>Manifest</em></h1>
    <p class="lede">A murder, dealt to your phones. Everyone holds a few cards. Nobody holds the answer — not even the host.</p>
  </div>

  ${netOn()?`
  <div class="card">
    <div class="eyebrow">Everyone on their own phone</div>
    <label><div class="eyebrow">Your name</div>
      <input id="nameIn" value="${esc(S.nameIn)}" maxlength="18" placeholder="How you'll show up to everyone" autocomplete="off"></label>
    <button class="btn" data-a="create">Start a new game</button>
    <label style="margin-top:14px"><div class="eyebrow">Join code</div>
      <input id="codeIn" class="code" value="${esc(S.codeIn)}" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off"></label>
    <button class="btn ghost" data-a="join">Join a game</button>
  </div>
  <button class="btn ghost" data-a="ping">Test the database connection</button>`
  :`<div class="err">No database URL set. Open index.html and paste your Firebase URL into <span style="font-family:var(--mono)">DB_URL</span> near the top of the script. Until then only the one-phone game works.</div>`}

  <div class="rule"></div>
  <div class="card">
    <div class="eyebrow">One phone, passed around</div>
    <p class="note" style="margin-top:0">Works with no signal at all. Each player taps their name to see their hand, then passes it on.</p>
    <button class="btn ghost" data-a="localSetup">Play on this phone</button>
  </div>

  ${okBar()}${errBar()}`;
}

/* ---------- lobby ---------- */
function lobby(){
  const g=S.game;
  const isHost = S.mode==="local" || (S.me && g.hostId===S.me.id);
  const probs=setupProblems(g);
  return `
  ${S.mode==="online"?`<div class="plate"><div class="eyebrow">Read this out to the table</div><div class="code">${esc(g.code)}</div></div>`:""}
  <div class="eyebrow" style="margin-top:26px">Aboard — ${g.players.length} of 8</div>
  <div class="card">
    ${g.players.length?g.players.map(p=>`<div class="row"><span>${esc(p.name)}</span>
      <span class="tag">${(S.mode==="online"&&p.id===g.hostId)?"HOST ":""}${(S.mode==="online"&&S.me&&p.id===S.me.id)?"YOU":""}</span></div>`).join("")
      :'<p class="note" style="margin:0">Nobody yet.</p>'}
  </div>

  ${S.mode==="local"?`
  <label><div class="eyebrow">Add a player</div><input id="addName" maxlength="18" placeholder="Name" autocomplete="off"></label>
  <button class="btn ghost" data-a="addPlayer">Add to the table</button>`:""}

  ${isHost?`
  <div class="rule"></div>
  <div class="eyebrow">The deck — one per line</div>
  <p class="note" style="margin-top:0">Swap these for real people and real places around you. Rooms should be spots someone can actually stand in — that's the whole point of playing it live. Tap away from a box to save it.</p>
  ${["suspects","weapons","rooms"].map(k=>`
    <div style="margin-bottom:14px">
      <div class="eyebrow">${k}</div>
      <textarea data-list="${k}" rows="${Math.max(4,g.setup[k].length)}">${esc(g.setup[k].join("\n"))}</textarea>
    </div>`).join("")}
  ${probs.length?'<div class="err">'+esc(probs[0])+'</div>':""}
  <button class="btn" data-a="deal" ${probs.length?"disabled":""}>Deal the cards</button>
  `:'<p class="note">Waiting for the host to deal. This updates on its own.</p>'}
  ${errBar()}
  ${footer()}`;
}

function footer(){
  return `<div class="footer">
    <span class="tag">${S.mode==="online"?"CODE "+esc(S.code):"ONE PHONE"}</span>
    <button data-a="leave">Leave game</button>
  </div>`;
}

/* ---------- game ---------- */
function game(){
  const g=S.game;

  if(S.mode==="online"&&(!S.me||!byId(g,S.me.id)))
    return '<div class="err">You\'re not in this game any more. The host may have restarted it.</div>'+
      '<button class="btn ghost" data-a="reset">Back to the start</button>';

  if(S.mode==="local"&&g.phase!=="over"&&S.viewer!==actorId(g)){
    const who=byId(g,actorId(g));
    if(!who) return '<div class="err">Lost track of whose turn it is.</div><button class="btn ghost" data-a="reset">Back to the start</button>';
    return `<div class="lock">
      <div class="eyebrow">Hand the phone to</div>
      <div class="who">${esc(who.name)}</div>
      <p class="note" style="margin-bottom:22px">Everyone else, eyes up.</p>
      <button class="btn" data-a="unlock">I'm ${esc(who.name)}</button>
    </div>${footer()}`;
  }

  const tabs=[["play","Table"],["notes","Notepad"],["log","Record"]];
  return `
  <div class="tabs">${tabs.map(t=>`<button data-a="tab" data-v="${t[0]}" aria-selected="${S.tab===t[0]}">${t[1]}</button>`).join("")}</div>
  ${S.tab==="play"?table():S.tab==="notes"?notepad():logView()}
  ${errBar()}
  ${footer()}`;
}

function hand(){
  const me=byId(S.game,myId());
  if(!me) return "";
  return `<div class="card"><div class="eyebrow">Your hand — nobody else sees this</div>
    <div class="chips">${me.hand.length?me.hand.map(c=>'<span class="chip">'+esc(c)+'</span>').join("")
      :'<span class="note">No cards. Everything else is in play.</span>'}</div></div>`;
}

function table(){
  const g=S.game, p=g.pending, meId=myId(), me=byId(g,meId);
  if(!me) return '<div class="err">Couldn\'t find your seat at this table.</div>';

  if(g.phase==="over"){
    const isHost = S.mode==="local" || g.hostId===meId;
    return `<div class="card" style="padding:22px">
      <div class="eyebrow">Case closed</div>
      <div class="big" style="font-size:30px;margin-bottom:16px">${g.winner==="nobody"?"Everyone guessed wrong.":esc(g.winner)+" solved it."}</div>
      <div style="font-size:17px;color:var(--brass);line-height:1.7">
        ${esc(g.solution.suspect)}<br>in the ${esc(g.solution.room)}<br>with the ${esc(g.solution.weapon)}</div>
    </div>
    ${isHost?'<button class="btn" data-a="again">Deal a new round, same players</button>':'<p class="note">Waiting on the host to deal again.</p>'}`;
  }

  if(p){
    const asker=byId(g,p.by), dis=p.disproverId?byId(g,p.disproverId):null;
    const line=esc(p.suggestion.suspect)+", in the "+esc(p.suggestion.room)+", with the "+esc(p.suggestion.weapon);

    if(dis&&!p.card&&dis.id===meId){
      return `<div class="card" style="padding:22px">
        <div class="eyebrow">You must disprove</div>
        <div class="big" style="font-size:24px;margin-bottom:6px">${line}</div>
        <p class="note" style="margin-bottom:18px">${esc(asker.name)} asked. Show one card — only ${esc(asker.name)} sees it.</p>
        ${(p.matches||[]).map(c=>'<button class="btn" data-a="show" data-v="'+esc(c)+'">Show '+esc(c)+'</button>').join("")}
      </div>`;
    }
    if(p.by===meId&&(p.card||!dis)){
      return `<div class="card" style="padding:22px">
        <div class="eyebrow">${dis?esc(dis.name)+" showed you":"Nobody could disprove it"}</div>
        <div class="huge ${dis?"":"miss"}">${dis?esc(p.card):"No card"}</div>
        <p class="note" style="margin-bottom:18px">${dis
          ?"Rule it out on your notepad before you tap on — this disappears."
          :"All three are either in your own hand or in the envelope."}</p>
        <button class="btn" data-a="closeAsk">Done — next player</button>
      </div>`;
    }
    return `<div class="card" style="padding:22px">
      <div class="eyebrow">In progress</div>
      <div class="big" style="font-size:23px;margin-bottom:12px">${line}</div>
      <p class="note">Asked by ${esc(asker?asker.name:"someone")}. ${dis?"Waiting on "+esc(dis.name)+" to show a card.":"Waiting on "+esc(asker?asker.name:"them")+"."}</p>
    </div>${hand()}`;
  }

  const cur=byId(g,g.order[g.turn]);
  const myTurn = !!cur && cur.id===meId && !me.out;
  syncPick(g);
  const sel=(label,k,opts)=>`<div style="margin-bottom:12px"><div class="eyebrow">${label}</div>
    <select data-pick="${k}">${opts.map(o=>'<option value="'+esc(o)+'"'+(S.pick[k]===o?" selected":"")+'>'+esc(o)+'</option>').join("")}</select></div>`;

  return `
  <div class="card">
    <div class="eyebrow">Now playing</div>
    <div class="big" style="${myTurn?"color:var(--brass)":""}">${myTurn?"Your turn":esc(cur?cur.name:"—")+"'s turn"}</div>
    ${me.out?'<p class="note" style="color:var(--signal);margin-bottom:0">You accused wrong. You still show cards, but your turns are over.</p>':""}
  </div>
  ${hand()}
  ${myTurn?`
  <div class="card">
    <div class="seg">
      <button data-a="mode" data-v="ask" aria-selected="${S.turnMode==="ask"}">Ask the table</button>
      <button data-a="mode" data-v="accuse" aria-selected="${S.turnMode==="accuse"}">Accuse</button>
    </div>
    ${sel("Suspect","s",g.setup.suspects)}
    ${sel("Weapon","w",g.setup.weapons)}
    ${sel("Room","r",g.setup.rooms)}
    ${S.turnMode==="ask"?`
      <p class="note">Walk to the room you're naming and say it out loud, then tap. The first person who can disprove you gets a private prompt.</p>
      <button class="btn" data-a="ask">Ask the table</button>`:`
      <p class="note" style="color:var(--signal)">Right and you win outright. Wrong and you're out — still showing cards, never winning.</p>
      ${S.confirm
        ?'<button class="btn signal" data-a="accuse">Lock it in — '+esc(S.pick.s)+", "+esc(S.pick.r)+", "+esc(S.pick.w)+'</button>'
        :'<button class="btn ghost" data-a="confirm">Make the accusation</button>'}`}
  </div>`:""}`;
}

function notepad(){
  const g=S.game, me=byId(g,myId());
  if(!me) return "";
  const n=notesFor(me.id);
  const group=(title,list)=>`<div style="margin-bottom:20px"><div class="eyebrow">${title}</div>
    ${list.map(c=>{
      const mine=me.hand.includes(c);
      const st=mine?1:(n[c]||0);
      const tag=mine?"IN HAND":st===1?"OUT":st===2?"SUSPECT":"";
      return '<div class="noteline" data-state="'+st+'" '+(mine?"":'data-a="mark" data-v="'+esc(c)+'"')+'>'+
        '<span>'+esc(c)+'</span><span class="tag" data-state="'+st+'">'+tag+'</span></div>';
    }).join("")}</div>`;
  return '<p class="note" style="margin-top:0">Tap a line to cycle it: blank, ruled out, prime suspect. Your own cards are struck out already. This is yours alone.</p>'+
    group("Suspects",g.setup.suspects)+group("Weapons",g.setup.weapons)+group("Rooms",g.setup.rooms);
}

function logView(){
  const g=S.game, meId=myId();
  if(!g.log||!g.log.length) return '<p class="note">Nothing yet.</p>';
  return '<div class="eyebrow">The record — everything said out loud</div>' + g.log.map(e=>{
    if(e.t==="start") return '<div class="card"><p class="note" style="margin:0">Cards dealt. Turn order: '+(e.names||[]).map(esc).join(" → ")+'</p></div>';
    if(e.t==="accuse") return '<div class="card"><div style="font-size:15px;line-height:1.5;color:'+(e.right?"var(--brass)":"var(--signal)")+'">'+
      esc(e.byName)+" accused "+esc(e.suggestion.suspect)+", "+esc(e.suggestion.room)+", "+esc(e.suggestion.weapon)+" — "+(e.right?"correct":"wrong, and out")+".</div></div>";
    const sees = e.by===meId || e.disproverId===meId;
    const passers = e.passerNames||[];
    return '<div class="card">'+
      '<div style="font-size:15px;line-height:1.5">'+esc(e.byName)+" asked: "+esc(e.suggestion.suspect)+", in the "+esc(e.suggestion.room)+", with the "+esc(e.suggestion.weapon)+'.</div>'+
      '<p class="note" style="margin:7px 0 0">'+(passers.length?esc(passers.join(", "))+" couldn't disprove. ":"")+
      (e.disproverName?esc(e.disproverName)+" showed a card"+((sees&&e.card)?" — "+esc(e.card):"")+".":"Nobody could disprove it.")+'</p></div>';
  }).join("");
}

/* ============================================================
   ACTIONS
   ============================================================ */
document.addEventListener("click",async ev=>{
  const el=ev.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;
  const g=S.game;
  S.ok="";

  if(a==="ping"){
    S.err=""; S.ok="Checking…"; render();
    try{
      const r=await fetch(url("__ping")+"?t="+Date.now(),{cache:"no-store"});
      if(!r.ok) throw new Error(r.status===401||r.status===403?"permission denied — open the Rules tab in Firebase and allow reads":"HTTP "+r.status);
      await r.json();
      S.ok="Database reachable. You're good to go."; S.err="";
    }catch(e){
      S.ok=""; S.err="Can't reach the database ("+e.message+"). Check DB_URL for a typo or a trailing slash.";
    }
    render(); return;
  }
  if(a==="localSetup"){
    S.mode="local"; S.game=makeGame("LOCAL",[]); S.screen="lobby"; S.err=""; render(); return;
  }
  if(a==="addPlayer"){
    const i=document.getElementById("addName"), name=(i?i.value:"").trim();
    if(!name){ S.err="Type a name first."; render(); return; }
    if(g.players.length>=8){ S.err="Eight is the limit."; render(); return; }
    if(g.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){ S.err="Two people can't share a name."; render(); return; }
    g.players.push({id:newId(),name:name,hand:[],out:false});
    if(!g.hostId) g.hostId=g.players[0].id;
    S.err=""; saveLocal(); render(); return;
  }
  if(a==="create"){
    const f=document.getElementById("nameIn");
    const name=(((f&&f.value)||S.nameIn)||"").trim();
    if(!name){ S.err="Put your name in first."; render(); return; }
    if(!netOn()){ S.err="No database URL set."; render(); return; }
    const id=newId(), code=newCode();
    const gm=makeGame(code,[{id:id,name:name,hand:[],out:false}]);
    try{ await netPut(gm); }
    catch(e){ S.err="Couldn't start a game — "+e.message+"."; render(); return; }
    S.mode="online"; S.me={id:id,name:name}; S.code=code; S.game=gm; S.lastSync=JSON.stringify(gm);
    S.screen="lobby"; S.err=""; saveLocal(); startPolling(); render(); return;
  }
  if(a==="join"){
    const nf=document.getElementById("nameIn"), cf=document.getElementById("codeIn");
    const name=(((nf&&nf.value)||S.nameIn)||"").trim();
    const code=((((cf&&cf.value)||S.codeIn)||"")).trim().toUpperCase();
    if(!name){ S.err="Put your name in first."; render(); return; }
    if(code.length!==4){ S.err="Codes are four letters."; render(); return; }
    let gm;
    try{ gm=await netGet(code); }
    catch(e){ S.err="Couldn't reach the database — "+e.message+"."; render(); return; }
    if(!gm){ S.err="No game under "+code+". Check the code with the host."; render(); return; }
    const existing=gm.players.find(p=>p.name.toLowerCase()===name.toLowerCase());
    if(existing){ S.me={id:existing.id,name:existing.name}; }
    else{
      if(gm.phase!=="lobby"){ S.err="That game is underway. Rejoin with the exact name you used before."; render(); return; }
      if(gm.players.length>=8){ S.err="That game is full at eight."; render(); return; }
      const id=newId(); gm.players.push({id:id,name:name,hand:[],out:false});
      try{ await netPut(gm); }catch(e){ S.err="Couldn't join — "+e.message+"."; render(); return; }
      S.me={id:id,name:name};
    }
    S.mode="online"; S.code=code; S.game=gm; S.lastSync=JSON.stringify(gm);
    S.screen="lobby"; S.err=""; saveLocal(); startPolling(); render(); return;
  }
  if(a==="deal"||a==="again"){
    S.pick={}; S.confirm=false; S.turnMode="ask";
    if(a==="again") S.notes={};
    if(await mutate(gm=>deal(gm))){ S.tab="play"; S.viewer=null; render(); }
    return;
  }
  if(a==="unlock"){ S.viewer=actorId(g); S.tab="play"; S.pick={}; S.turnMode="ask"; S.confirm=false; render(); return; }
  if(a==="tab"){ S.tab=v; render(); return; }
  if(a==="mode"){ S.turnMode=v; S.confirm=false; render(); return; }
  if(a==="confirm"){ S.confirm=true; render(); return; }
  if(a==="mark"){ const id=myId(); if(!id) return; const n=notesFor(id); n[v]=((n[v]||0)+1)%3; saveLocal(); render(); return; }
  if(a==="leave"||a==="reset"){
    stopPolling(); clearLocal();
    Object.assign(S,{screen:"home",mode:null,code:null,me:null,viewer:null,game:null,
      tab:"play",turnMode:"ask",confirm:false,err:"",ok:"",pick:{},notes:{},lastSync:"",busy:false});
    render(); return;
  }

  if(a==="ask"){
    const meId=myId(), sug={suspect:S.pick.s,weapon:S.pick.w,room:S.pick.r};
    if(!sug.suspect||!sug.weapon||!sug.room){ S.err="Pick all three first."; render(); return; }
    const ok=await mutate(gm=>{
      if(gm.pending) return;
      const i=gm.order.indexOf(meId);
      if(i<0) return;
      const passers=[]; let disproverId=null, matches=[];
      for(let k=1;k<gm.order.length;k++){
        const pl=byId(gm,gm.order[(i+k)%gm.order.length]);
        const m=pl.hand.filter(c=>c===sug.suspect||c===sug.weapon||c===sug.room);
        if(m.length){ disproverId=pl.id; matches=m; break; }
        passers.push(pl.id);
      }
      gm.pending={by:meId,suggestion:sug,passers:passers,disproverId:disproverId,matches:matches,card:null};
    });
    if(ok&&S.mode==="local") S.viewer=null;
    render(); return;
  }
  if(a==="show"){
    const ok=await mutate(gm=>{ if(gm.pending&&!gm.pending.card) gm.pending.card=v; });
    if(ok&&S.mode==="local") S.viewer=null;
    render(); return;
  }
  if(a==="closeAsk"){
    const ok=await mutate(gm=>{
      const p=gm.pending; if(!p) return;
      const askerName=(byId(gm,p.by)||{}).name||"Someone";
      gm.log.unshift({t:"ask",by:p.by,byName:askerName,suggestion:p.suggestion,
        passerNames:(p.passers||[]).map(id=>(byId(gm,id)||{}).name||"?"),
        disproverId:p.disproverId||null,
        disproverName:p.disproverId?((byId(gm,p.disproverId)||{}).name||"?"):null,
        card:p.card||null});
      gm.pending=null; advance(gm);
    });
    if(ok&&S.mode==="local") S.viewer=null;
    S.confirm=false; render(); return;
  }
  if(a==="accuse"){
    const meId=myId(), sug={suspect:S.pick.s,weapon:S.pick.w,room:S.pick.r};
    const ok=await mutate(gm=>{
      const p=byId(gm,meId); if(!p||!gm.solution) return;
      const right = sug.suspect===gm.solution.suspect && sug.weapon===gm.solution.weapon && sug.room===gm.solution.room;
      gm.log.unshift({t:"accuse",by:meId,byName:p.name,suggestion:sug,right:right});
      if(right){ gm.phase="over"; gm.winner=p.name; }
      else{ p.out=true; advance(gm); }
    });
    S.confirm=false;
    if(ok&&S.mode==="local") S.viewer=null;
    render(); return;
  }
});

/* save typed values without re-rendering the world */
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(!t.dataset) return;
  if(t.dataset.pick){ S.pick[t.dataset.pick]=t.value; S.confirm=false; return; }
  if(t.dataset.list){
    const which=t.dataset.list;
    const list=t.value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!list.length){ S.err="A list can't be empty."; render(); return; }
    mutate(gm=>{ gm.setup[which]=list; },{quiet:true});
  }
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="nameIn") S.nameIn=ev.target.value;
  if(ev.target.id==="codeIn") S.codeIn=ev.target.value.toUpperCase();
});

/* ---------------- boot ---------------- */
(function boot(){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(LS)||"null"); }catch(e){}
  if(saved){
    S.notes=saved.notes||{};
    if(saved.online&&netOn()&&saved.code&&saved.me){
      S.mode="online"; S.code=saved.code; S.me=saved.me; S.screen="lobby";
      render();
      netGet(saved.code).then(g=>{
        if(g){ S.game=g; S.lastSync=JSON.stringify(g); startPolling(); }
        else{
          clearLocal();
          Object.assign(S,{screen:"home",mode:null,code:null,me:null,game:null});
          S.err="That game is gone from the database.";
        }
        render();
      }).catch(e=>{
        Object.assign(S,{screen:"home",mode:null,code:null,me:null,game:null});
        S.err="Couldn't reach the database — "+e.message+".";
        render();
      });
      return;
    }
    if(saved.game){ S.mode="local"; S.game=saved.game; S.screen="lobby"; }
  }
  render();
})();
</script>
